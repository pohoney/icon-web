<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>icon-web-backstage</title>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-topbar">
        <div>
          <p class="kicker">EdgeOne Blob</p>
          <h1>icon-web-backstage</h1>
        </div>
        <a href="/" class="ghost-link">前台</a>
      </header>

      <section class="panel token-panel">
        <label>
          <span>Admin Token</span>
          <input id="adminToken" type="password" autocomplete="off" placeholder="EdgeOne 环境变量 ICON_ADMIN_TOKEN" />
        </label>
        <button id="saveToken" type="button">保存到本机</button>
        <button id="loadIcons" type="button">读取数据</button>
      </section>

      <section class="panel">
        <div class="list-head">
          <div>
            <h2>Excel 顺序上传表</h2>
            <p class="status-text">默认读取 tennis_gesture_icon_30.xlsx 生成的 30 行映射；排序按表格从上到下。</p>
          </div>
          <div class="table-actions">
            <label class="folder-picker">
              <span>选择 icon 文件夹</span>
              <input id="folderInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" webkitdirectory directory multiple />
            </label>
            <button id="resetTable" type="button" class="secondary">重载表格</button>
            <button id="uploadSelected" type="button">上传已选图片并保存</button>
          </div>
        </div>
        <p id="statusText" class="status-text">等待操作</p>
        <div class="table-wrap">
          <table class="upload-table">
            <thead>
              <tr>
                <th>排序</th>
                <th>预览</th>
                <th>ID</th>
                <th>中文动作</th>
                <th>English Action</th>
                <th>Prompt</th>
                <th>匹配文件</th>
                <th>上传</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="iconTable"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./admin.js" type="module"></script>
  </body>
</html>
